<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年1月家庭账本 - 可视化报告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #fff; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .stat-card.income { border-left: 4px solid #22c55e; }
        .stat-card.expense { border-left: 4px solid #ef4444; }
        .stat-card.net { border-left: 4px solid #f59e0b; }
        .stat-value { font-size: 2.2em; font-weight: bold; margin-bottom: 5px; }
        .stat-card.income .stat-value { color: #22c55e; }
        .stat-card.expense .stat-value { color: #ef4444; }
        .stat-card.net .stat-value { color: #f59e0b; }
        .stat-label { color: #94a3b8; font-size: 0.9em; }
        .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .chart-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .chart-title { color: #fff; font-size: 1.3em; margin-bottom: 20px; }
        .chart-container { position: relative; height: 300px; }
        .daily-chart { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; }
        .daily-container { height: 250px; }
        .top-expenses { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .expense-item { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .expense-item:last-child { border-bottom: none; }
        .expense-rank { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffb800); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; }
        .rank-other { background: rgba(255,255,255,0.1); color: #94a3b8; }
        .expense-name { flex: 1; color: #fff; font-size: 1.1em; }
        .expense-bar { width: 200px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; margin: 0 15px; overflow: hidden; }
        .expense-bar-fill { height: 100%; border-radius: 6px; transition: width 1s ease-out; }
        .expense-amount { color: #fff; font-weight: bold; font-size: 1.1em; min-width: 80px; text-align: right; }
        .footer { text-align: center; color: #64748b; margin-top: 40px; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 2026年1月家庭账本</h1>
        <p class="subtitle">Jarvis AI 智能分析报告</p>
        
        <div class="stats-row">
            <div class="stat-card income"><div class="stat-value">€15.90</div><div class="stat-label">💰 总收入</div></div>
            <div class="stat-card expense"><div class="stat-value">€1,133.19</div><div class="stat-label">💸 总支出</div></div>
            <div class="stat-card net"><div class="stat-value">-€1,117.29</div><div class="stat-label">📉 净流入</div></div>
            <div class="stat-card"><div class="stat-value">37</div><div class="stat-label">📁 记录数</div></div>
        </div>
        
        <div class="charts-row">
            <div class="chart-card">
                <div class="chart-title">🥗 支出分类分布</div>
                <div class="chart-container"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">💳 支付方式分布</div>
                <div class="chart-container"><canvas id="paymentChart"></canvas></div>
            </div>
        </div>
        
        <div class="daily-chart">
            <div class="chart-title">📈 每日支出趋势</div>
            <div class="daily-container"><canvas id="dailyChart"></canvas></div>
        </div>
        
        <div class="top-expenses">
            <div class="chart-title">🏆 支出排行 TOP 10</div>
            <div id="expenseList"></div>
        </div>
        
        <div class="footer">Generated by Jarvis AI | Data Source: Supabase</div>
    </div>
    
    <script>
        const categoryData = {
            labels: ['超市', '交通-燃油', '服装', '健身', '餐饮', '孩子-服装', '娱乐', '家电', '医疗', '其他', '交通-公交'],
            values: [527.95, 196.48, 183.20, 90.00, 47.31, 26.00, 22.80, 15.80, 8.95, 7.40, 7.30],
            colors: ['#22c55e', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1', '#14b8a6']
        };
        
        const paymentData = {
            labels: ['BBVA', 'AMEX', '招行信用卡', '其他信用卡', '现金'],
            values: [860.79, 183.20, 43.12, 26.00, 20.08],
            colors: ['#1e40af', '#7c3aed', '#dc2626', '#059669', '#64748b']
        };
        
        const dailyData = {
            dates: ['1/4', '1/5', '1/7', '1/9', '1/11', '1/13', '1/14', '1/15', '1/16', '1/17', '1/18', '1/20', '1/22', '1/23', '1/24', '1/25', '1/27', '1/28'],
            amounts: [43.12, 21.17, 43.69, 15.80, 70.53, 17.89, 7.40, 151.62, 9.88, 168.61, 81.20, 22.36, 68.56, 44.85, 170.91, 75.94, 57.01, 54.55]
        };
        
        new Chart(document.getElementById('categoryChart'), {
            type: 'doughnut',
            data: { labels: categoryData.labels, datasets: [{ data: categoryData.values, backgroundColor: categoryData.colors, borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#fff', padding: 15 } } } }
        });
        
        new Chart(document.getElementById('paymentChart'), {
            type: 'doughnut',
            data: { labels: paymentData.labels, datasets: [{ data: paymentData.values, backgroundColor: paymentData.colors, borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#fff', padding: 15 } } } }
        });
        
        new Chart(document.getElementById('dailyChart'), {
            type: 'bar',
            data: { labels: dailyData.dates, datasets: [{ label: '每日支出 €', data: dailyData.amounts, backgroundColor: 'rgba(239, 68, 68, 0.7)', borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } }, y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8', callback: v => '€' + v } } }, plugins: { legend: { display: false } } }
        });
        
        const expenses = categoryData.labels.map((name, i) => ({ name, amount: categoryData.values[i], color: categoryData.colors[i] })).sort((a, b) => b.amount - a.amount);
        const maxAmount = expenses[0].amount;
        
        expenses.forEach((item, i) => {
            const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-other';
            const pct = (item.amount / maxAmount * 100).toFixed(0);
            document.getElementById('expenseList').innerHTML += `
                <div class="expense-item">
                    <div class="expense-rank ${rankClass}">${i + 1}</div>
                    <div class="expense-name">${item.name}</div>
                    <div class="expense-bar"><div class="expense-bar-fill" style="width: ${pct}%; background: ${item.color};"></div></div>
                    <div class="expense-amount">€${item.amount.toFixed(2)}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
